services:
  meet:
    build:
      context: ./meet
      dockerfile: Dockerfile
    image: livekit-meet-product:latest
    container_name: livekit-meet-product
    env_file:
      - ./meet/.env.production
    environment:
      NODE_ENV: production
      PORT: "3001"
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:3001:3001"
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:v1.13.11
    container_name: livekit-server-product
    command:
      - --config
      - /etc/livekit.yml
      - --bind
      - 127.0.0.1
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    network_mode: host
    volumes:
      - ./livekit.yml:/etc/livekit.yml:ro
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    container_name: livekit-meet-nginx
    network_mode: host
    depends_on:
      - meet
      - livekit
    volumes:
      - ./nginx/livekit-meet.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.local/nginx-certs:/etc/nginx/certs:ro
    restart: unless-stopped
