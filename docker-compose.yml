services:
  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit-server-local

    command:
      - --config
      - /etc/livekit.yaml
      - --dev
      - --bind
      - 127.0.0.1

    network_mode: host

    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

    restart: unless-stopped
